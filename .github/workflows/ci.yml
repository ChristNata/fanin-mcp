name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  STRIPPED_SIZE_LIMIT_BYTES: 10485760

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.8.1
        with:
          cache-on-failure: true

      - name: Install cargo audit and deny
        uses: taiki-e/install-action@v2.54.0
        with:
          tool: cargo-audit,cargo-deny

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Integration tests
        run: cargo test --test integration

      - name: Build release
        run: cargo build --release

      - name: Check stripped release binary size
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = if ($IsWindows) { 'target/release/fanin-mcp.exe' } else { 'target/release/fanin-mcp' }
          $stripped = if ($IsWindows) { 'target/release/fanin-mcp.stripped.exe' } else { 'target/release/fanin-mcp.stripped' }
          Copy-Item $bin $stripped -Force

          if ($IsWindows) {
            $hostLine = (rustc -vV | Select-String '^host:').ToString()
            $hostTriple = $hostLine.Replace('host: ', '').Trim()
            $toolDir = Join-Path (rustc --print sysroot) "lib/rustlib/$hostTriple/bin"
            $strip = Join-Path $toolDir 'llvm-strip.exe'
            $objcopy = Join-Path $toolDir 'rust-objcopy.exe'
            if (Test-Path $strip) {
              & $strip --strip-all $stripped
            } elseif (Test-Path $objcopy) {
              & $objcopy --strip-all $stripped
            } else {
              throw "no strip tool found in $toolDir"
            }
          } elseif ($IsMacOS) {
            strip -x $stripped
          } else {
            strip --strip-all $stripped
          }

          $size = (Get-Item $stripped).Length
          Write-Host "stripped binary size: $size bytes"
          if ($size -ge [int64]$env:STRIPPED_SIZE_LIMIT_BYTES) {
            throw "stripped binary is $size bytes; limit is < $env:STRIPPED_SIZE_LIMIT_BYTES bytes"
          }

      - name: Audit advisories
        run: cargo audit

      - name: Check deny policy
        run: cargo deny check

      - name: Token benchmark
        run: cargo bench --bench token_cost
