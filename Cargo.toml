[package]
name = "fanin-mcp"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "A standalone, stdio-native MCP proxy that federates many upstream MCP servers behind a single endpoint."
repository = "https://github.com/ChristNata/fanin-mcp"
homepage = "https://github.com/ChristNata/fanin-mcp"
readme = "README.md"
keywords = ["mcp", "proxy", "llm", "stdio", "aggregator"]
categories = ["command-line-utilities", "development-tools"]
publish = true
exclude = [
    "docs/",
    ".claude/",
    ".opencode/",
    ".github/",
    "CLAUDE.md",
    "opencode.json",
    ".mcp.json",
    "deny.toml",
]

# Auto-discovery is disabled so the two binary targets and the single
# integration test target are fully explicit. Without this, cargo would
# auto-discover `src/main.rs` as a bin (colliding with the explicit
# `[[bin]] name = "fanin-mcp"` below) and could mis-scan files under
# `tests/`. The probe fixture lives under `tests/probe-server/` but is a
# `[[bin]]` target, not a test target; `autotests = false` ensures cargo
# never treats anything under `tests/` as an integration test except the
# one declared `[[test]]` below.
autobins = false
autotests = false

[features]
probe-fixture = []

[dependencies]
# rmcp — the official MCP Rust SDK, server and client roles in one process.
# D-015: pinned EXACTLY with `=x.y.z`; `Cargo.lock` is committed. The rmcp
# API moves fast; the pin prevents implementers from fighting the compiler
# with stale signatures. Features: `server` + `client` (dual role),
# `transport-io` (server-side stdio), `transport-child-process`
# (client-side stdio over a spawned child — used in later phases to connect
# to upstreams), `transport-streamable-http-client` +
# `transport-streamable-http-client-reqwest` (reqwest-backed client path for
# loopback Streamable-HTTP upstreams).
rmcp = { version = "=1.8.0", default-features = false, features = [
    "server",
    "client",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
] }

# process-wrap — provides JobObject (Windows) and ProcessSession/ProcessGroup (Unix)
# wrappers. rmcp 1.8.0's TokioChildProcess::builder accepts CommandWrap natively
# (via the `transport-child-process` feature). We enable the tokio frontend and
# the containment wrappers so that hard-kill of fanin-mcp (taskkill /F, etc.)
# tears down the entire upstream tree with zero orphans (D-009).
process-wrap = { version = "9", default-features = false, features = [
    "tokio1",
    "job-object",
    "kill-on-drop",
    "creation-flags",
    "process-group",
    "process-session",
] }

# Tokio full — the async runtime. Later phases exercise process spawning,
# io, sync, time; `full` keeps the feature set stable across phases so
# Cargo.toml is not churned by P0.2/P0.3.
tokio = { version = "1", features = ["full"] }

# Serialization + CLI + diagnostics + schema generation.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# toml — the server config file format. serde-compatible; `from_str` parses
# the Phase 1 TOML config (servers + namespaces) into the config model.
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
# schemars is pulled transitively by rmcp's `server` feature, but it is also
# a direct build-time input for tool input-schema generation in P0.2, so it
# is declared explicitly here.
schemars = "0.8"
# http — header name/value types used by rmcp's Streamable-HTTP custom header API.
http = "1"

# Hidden prompt for `cred set`.
rpassword = "7"

[target.'cfg(windows)'.dependencies]
# keyring v3 ships no backend unless a platform feature is enabled.
keyring = { version = "3", features = ["windows-native"] }

# windows — direct Win32 Job Object calls for hard-kill process-tree
# containment. process-wrap's rmcp integration spawns correctly, but the job
# handle must be held explicitly by fanin-mcp so kernel KILL_ON_JOB_CLOSE is
# the hard-kill carrier.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

# libc is needed on ALL Unix: killpg (process-group teardown, macOS + Linux) and
# prctl/PR_SET_PDEATHSIG (Linux only, cfg-gated in code). macOS uses the Apple
# Keychain (no libdbus), so this stays minimal.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Explicit dev-deps so the integration test binary is self-contained per
# tests.md. The main crate's `tokio = { features = ["full"] }` unifies with
# this narrower feature set; the dev-dep declaration documents the test
# binary's actual requirements.
tokio = { version = "1", features = [
    "process",
    "io-util",
    "macros",
    "rt",
    "rt-multi-thread",
    "time",
] }
serde_json = "1"
# tempfile — Phase 1 config-fixture helper writes TOML configs and log files
# to the OS temp dir. Held for the lifetime of the spawned child so the path
# stays valid on Windows (where the file is opened by the child).
tempfile = "3"

# --- Explicit target declarations --------------------------------------------
# With `autobins = false` / `autotests = false` above, these are the only
# build targets cargo sees. The probe bin name MUST be `probe-server` so
# cargo injects `CARGO_BIN_EXE_PROBE_SERVER` for the integration tests'
# `spawn_bin("probe-server")` (D-016, tests.md).

[[bin]]
name = "fanin-mcp"
path = "src/main.rs"

[[bin]]
name = "probe-server"
path = "tests/probe-server/main.rs"
required-features = ["probe-fixture"]   # non-default → cargo install skips it

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[bench]]
name = "token_cost"
path = "benches/token_cost.rs"
harness = false
